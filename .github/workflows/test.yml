name: test

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']
  workflow_dispatch:

jobs:
  checks:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [format, lint, typecheck, test, build, docs]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Cache Playwright browser downloads to speed up test job
      - name: Cache Playwright browsers
        if: matrix.task == 'test'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: matrix.task == 'test'
        run: pnpm exec playwright install chromium

      - name: Run ${{ matrix.task }}
        run: |
          case "${{ matrix.task }}" in
            format) pnpm run format ;;
            lint) pnpm run lint ;;
            typecheck) pnpm run typecheck ;;
            test) pnpm run test ;;
            build) pnpm run build ;;
            docs) pnpm run docs ;;
          esac

  # Verify both ends of the declared kysely peer range (^0.28 || ^0.29).
  kysely-compat:
    name: kysely ${{ matrix.kysely }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kysely: ['0.28', '0.29']
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Pin kysely ${{ matrix.kysely }}
        run: pnpm add -D "kysely@^${{ matrix.kysely }}"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Typecheck against kysely ${{ matrix.kysely }}
        run: pnpm run typecheck

      - name: Test against kysely ${{ matrix.kysely }}
        run: pnpm run test:run
